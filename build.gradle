plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bintime'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc17'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootJar') {
	archiveFileName = 'bintime.jar'
}

// API 골격의 Java 포맷만 통일하고 기존 부트스트랩 코드는 변경하지 않는다.
configurations {
	javaFormatter
}

dependencies {
	javaFormatter 'com.google.googlejavaformat:google-java-format:1.28.0:all-deps'
}

tasks.register('format', JavaExec) {
	classpath = configurations.javaFormatter
	mainClass = 'com.google.googlejavaformat.java.Main'
	jvmArgs '--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
		'--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
		'--add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
		'--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
		'--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
		'--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED'
	args '--replace'
	args fileTree('src').matching { include '**/*.java'; exclude '**/package-info.java', '**/BintimeApplication.java', '**/BintimeApplicationTests.java' }.files
}

// 실제 OpenAI 호출은 명시적으로 실행하는 별도 검증에서만 허용한다.
tasks.register('testOpenAi', Test) {
	group = 'verification'
	description = 'Generate a user vector with the real OPENAI_API_KEY from .env'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	include '**/UserVectorLiveTests.class'
	environment 'RUN_OPENAI_INTEGRATION', '1'
	outputs.upToDateWhen { false }
}
