name: bintime-dev

services:
  oracle:
    image: container-registry.oracle.com/database/free:23.26.3.0-lite
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Set ORACLE_PWD in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:${ORACLE_PORT:?Set ORACLE_PORT in .env}:1521'
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./infra/oracle/local-setup:/opt/oracle/scripts/startup:ro
    healthcheck:
      test: [CMD, /opt/oracle/checkDBStatus.sh]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: [/bin/sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      - '127.0.0.1:${REDIS_PORT:?Set REDIS_PORT in .env}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  oracle-data:
  redis-data:
