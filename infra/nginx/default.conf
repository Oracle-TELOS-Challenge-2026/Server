map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 브라우저에서 API를 호출하는 프론트 주소만 허용한다.
map $http_origin $cors_origin {
    default '';
    'http://127.0.0.1:5173' $http_origin;
    'http://localhost:5173' $http_origin;
    'https://frontend-oracle.vercel.app' $http_origin;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream bintime {
    zone bintime 64k;
    server app:8080 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://140.238.19.165$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/140.238.19.165/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/140.238.19.165/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_buffering off;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials 'true' always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-CSRF-Token, Last-Event-ID' always;
    add_header Access-Control-Max-Age 600 always;
    add_header Vary Origin always;

    location = /healthz {
        proxy_pass http://bintime/actuator/health/readiness;
    }

    location /actuator {
        return 404;
    }

    location / {
        if ($request_method = OPTIONS) {
            return 204;
        }
        proxy_pass http://bintime;
    }
}
