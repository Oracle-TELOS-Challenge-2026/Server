name: bintime

services:
  app:
    image: bintime-backend:local
    pull_policy: never
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEARCH_ELASTICSEARCH_URL: ${SEARCH_ELASTICSEARCH_URL:-http://elasticsearch:9200}
      SEARCH_ELASTICSEARCH_ALIAS: ${SEARCH_ELASTICSEARCH_ALIAS:-bintime-stores}
      SEARCH_ELASTICSEARCH_USERNAME: ${SEARCH_ELASTICSEARCH_USERNAME:-elastic}
      SEARCH_ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      SEARCH_ELASTICSEARCH_AUTHORIZATION: ${SEARCH_ELASTICSEARCH_AUTHORIZATION:-}
      SEARCH_INDEX_REBUILD: ${SEARCH_INDEX_REBUILD:-false}
      BINTIME_STORE_EVENT_DELIVERY_ENABLED: ${BINTIME_STORE_EVENT_DELIVERY_ENABLED:-true}
      SEARCH_SCHEDULING_ENABLED: ${SEARCH_SCHEDULING_ENABLED:-true}
      SEARCH_MATCHING_MINIMUM_SIMILARITY: ${SEARCH_MATCHING_MINIMUM_SIMILARITY:-0.5}
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-https://140.238.19.165/api/v1/auth/oauth/kakao/callback}
      FRONTEND_URL: ${FRONTEND_URL:-https://frontend-oracle.vercel.app}
      AUTH_ALLOWED_RETURN_PATHS: ${AUTH_ALLOWED_RETURN_PATHS:-/}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    networks:
      - default
      - search
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', http://localhost:8080/actuator/health/readiness]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 90s
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: [/bin/sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # 앱과 같은 호스트의 비공개 Docker 네트워크에서만 접근한다.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.6
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'true'
      xpack.security.autoconfiguration.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    mem_limit: ${ES_MEMORY_LIMIT:-1g}
    volumes:
      - search-es-prod:/usr/share/elasticsearch/data
    networks:
      - search
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent --max-time 5 --user "elastic:$$ELASTIC_PASSWORD" "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s" > /dev/null']
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80'
      - '${HTTP_BIND_ADDRESS:-127.0.0.1}:80:80'
      - '${HTTP_BIND_ADDRESS:-127.0.0.1}:443:443'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./infra/certbot/conf:/etc/letsencrypt:ro,z
      - ./infra/certbot/www:/var/www/certbot:ro,z
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  search:
    internal: true

volumes:
  search-es-prod:
  redis-data:
