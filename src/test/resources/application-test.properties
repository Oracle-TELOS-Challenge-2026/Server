# 서로 다른 Spring 테스트 컨텍스트의 스키마 초기화가 충돌하지 않도록 DB를 분리한다.
spring.datasource.generate-unique-name=true
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none

spring.sql.init.schema-locations=classpath:search-schema.sql
search.scheduling-enabled=false

bintime.store.expiration-enabled=false
bintime.store.event-delivery-enabled=false
