# 서버 .env는 compose.yaml이 읽어 컨테이너 환경 변수로 전달한다.
# 로컬 .env를 읽지 않아 개발 DB 설정이 배포에 섞이지 않는다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

bintime.auth.redirect-uri=${KAKAO_REDIRECT_URI}
bintime.auth.frontend-url=${FRONTEND_URL}
# 현재 배포 Nginx가 프론트 CORS 허용 목록을 관리한다.
bintime.auth.cors-enabled=false
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
