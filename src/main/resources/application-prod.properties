# 서버 .env는 compose.yaml이 읽어 컨테이너 환경 변수로 전달한다.
# 로컬 .env를 읽지 않아 개발 DB 설정이 배포에 섞이지 않는다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

bintime.auth.redirect-uri=${KAKAO_REDIRECT_URI}
bintime.auth.frontend-url=${FRONTEND_URL}
# 현재 배포 Nginx가 프론트 CORS 허용 목록을 관리한다.
bintime.auth.cors-enabled=false
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none

# Compose 내부 ES 주소. 별도 ES 서버를 쓰면 해당 환경의 HTTPS URL로 변경한다.
search.elasticsearch.url=${SEARCH_ELASTICSEARCH_URL:http://elasticsearch:9200}
search.elasticsearch.alias=${SEARCH_ELASTICSEARCH_ALIAS:bintime-stores}
search.elasticsearch.username=${SEARCH_ELASTICSEARCH_USERNAME:elastic}
search.elasticsearch.password=${SEARCH_ELASTICSEARCH_PASSWORD:}
# ApiKey 등 전체 Authorization 헤더를 지정하면 username/password보다 우선한다.
search.elasticsearch.authorization=${SEARCH_ELASTICSEARCH_AUTHORIZATION:}
