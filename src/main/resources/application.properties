spring.application.name=bintime
spring.profiles.default=local

# Swagger 첫 화면에서 내부 API 2개가 아닌 전체 계약을 보여준다.
springdoc.swagger-ui.urls-primary-name=all
# 전역 예외 처리기의 오류 응답을 모든 API에 자동으로 추가하지 않는다.
springdoc.override-with-generic-response=false

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis

# 카카오 키가 없으면 서버는 실행하되 로그인 시작 API가 503을 반환한다.
bintime.auth.client-id=${KAKAO_CLIENT_ID:}
bintime.auth.client-secret=${KAKAO_CLIENT_SECRET:}
bintime.auth.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/kakao/callback}
bintime.auth.frontend-url=${FRONTEND_URL:http://localhost:5173}
bintime.auth.allowed-return-paths=${AUTH_ALLOWED_RETURN_PATHS:/}
bintime.auth.cors-enabled=true

server.servlet.session.cookie.name=bt_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
