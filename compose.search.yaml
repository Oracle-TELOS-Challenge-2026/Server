services:
  elasticsearch:
    restart: unless-stopped
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent --max-time 5 "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s" > /dev/null']
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 60s
    volumes:
      - search-es:/usr/share/elasticsearch/data
volumes:
  search-es:
